name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CGO_ENABLED: '0'
  GOWORK: 'off'

jobs:
  specs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: make spec-check

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.x'
          check-latest: true
      - name: Install software text rendering dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          # Avoid the Azure mirror that stalled the hosted runner's font download.
          sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
          sudo tee /etc/apt/apt.conf.d/80-ci-downloads <<'EOF'
          Acquire::Retries "3";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          EOF
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libpangocairo-1.0-0 fonts-noto-cjk fonts-noto-color-emoji
      - run: go vet ./...
      - run: go test -shuffle=on ./... -count=1 -timeout=180s
      - run: go build ./...

  race:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.x'
          check-latest: true
      - name: Install software text rendering dependencies
        timeout-minutes: 5
        run: |
          # Avoid the Azure mirror that stalled the hosted runner's font download.
          sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
          sudo tee /etc/apt/apt.conf.d/80-ci-downloads <<'EOF'
          Acquire::Retries "3";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          EOF
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libpangocairo-1.0-0 fonts-noto-cjk fonts-noto-color-emoji
      # Each headless rasterizer uses several cores; avoid competing test binaries.
      - run: go test -race -p 1 -shuffle=on ./... -count=1 -timeout=600s

  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.x'
          check-latest: true
      - name: Check module metadata and formatting
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go mod verify
          test -z "$(gofmt -l .)"
      - run: go tool mygo vet .
      - run: make wasm
      - name: Lint Go
        uses: >- # v9.3.0
          golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
        with:
          version: v2.14.0
          args: ./...
      - name: Validate workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Check reachable vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
