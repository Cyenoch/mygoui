name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      CGO_ENABLED: '0'
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Install software text rendering dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libpangocairo-1.0-0
      - run: go mod download
      - run: go mod verify
      - run: go vet ./...
      - run: go tool mygo vet .
      - run: go test -shuffle=on ./... -count=1 -timeout=180s
      - run: go build ./...
      - name: Check module metadata and formatting
        if: runner.os == 'Linux'
        shell: bash
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          test -z "$(gofmt -l .)"
      - name: Check for data races
        if: runner.os == 'Linux'
        env:
          CGO_ENABLED: '1'
        run: go test -race -shuffle=on ./... -count=1 -timeout=300s
      - name: Build WebAssembly
        if: runner.os == 'Linux'
        env:
          GOOS: js
          GOARCH: wasm
        run: go build ./...

  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CGO_ENABLED: '0'
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0 run ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
